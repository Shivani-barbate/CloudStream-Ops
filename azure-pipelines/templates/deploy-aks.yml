jobs:
- job: DeployToAKS
  steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: azure-service-connection-new
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az aks get-credentials \
          --resource-group cloudstream-rg \
          --name cloudstream-aks \
          --overwrite-existing

        kubectl apply -f manifests/base/api-configmap.yaml
        kubectl apply -f manifests/base/api-secret.yaml
        kubectl apply -f manifests/base/api-deployment.yaml
        kubectl apply -f manifests/base/api-service.yaml
        kubectl apply -f manifests/base/api-hpa.yaml

        kubectl apply -f manifests/base/kafka-configmap.yaml
        kubectl apply -f manifests/base/kafka-statefulset.yaml
        kubectl apply -f manifests/base/kafka-service.yaml

        kubectl apply -f manifests/base/ingress.yaml
