apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudstream-ingress
  namespace: cloudstream-dev
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 80