apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: monitoring
spec:
  secretName: grafana-tls-secret

  commonName: grafana.cloudstream.local

  dnsNames:
    - grafana.cloudstream.local

  issuerRef:
    name: selfsigned-clusterissuer
    kind: ClusterIssuer