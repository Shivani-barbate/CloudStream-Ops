apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-service
  namespace: cloudstream-dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-service

  template:
    metadata:
      labels:
        app: api-service

    spec:
      containers:
      - name: api-service
        image: cloudstreamacrshivani001.azurecr.io/api-service:v5
        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        env:
        - name: FUNCTION_URL
          value: "https://cloudstream-order-function.azurewebsites.net/api/orderNotification"

        - name: EVENTHUB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: eventhub-secret
              key: EVENTHUB_CONNECTION_STRING

        envFrom:
        - configMapRef:
            name: api-config

        - secretRef:
            name: api-secret

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"