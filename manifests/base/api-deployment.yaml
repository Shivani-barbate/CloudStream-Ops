apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-service
  namespace: cloudstream-dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-service

  template:
    metadata:
      labels:
        app: api-service
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: api-sa

      containers:
      - name: api-service
        image: cloudstreamacrshivani001.azurecr.io/api-service:v10
        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        env:
        - name: PORT
          value: "3000"

        - name: FUNCTION_URL
          value: "https://cloudstream-order-function.azurewebsites.net/api/orderNotification"

        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          value: "InstrumentationKey=7a3283bd-2c1a-49b1-b9e2-93ab4f577b8f;IngestionEndpoint=https://centralindia-0.in.applicationinsights.azure.com/;LiveEndpoint=https://centralindia.livediagnostics.monitor.azure.com/;ApplicationId=9a96ee74-8a43-4542-ab31-96ab814559c9"

        envFrom:
        - configMapRef:
            name: api-config

        - secretRef:
            name: api-secret

        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-kv-secrets"