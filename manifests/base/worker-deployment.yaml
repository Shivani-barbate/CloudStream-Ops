apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker-service
  namespace: cloudstream-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: worker-service

  template:
    metadata:
      labels:
        app: worker-service
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: worker-sa

      containers:
      - name: worker-service
        image: cloudstreamacrshivani001.azurecr.io/worker-service:v11
        imagePullPolicy: Always

        env:
        - name: FUNCTION_URL
          value: "https://cloudstream-order-function.azurewebsites.net/api/orderNotification"

        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          value: "InstrumentationKey=7a3283bd-2c1a-49b1-b9e2-93ab4f577b8f;IngestionEndpoint=https://centralindia-0.in.applicationinsights.azure.com/;LiveEndpoint=https://centralindia.livediagnostics.monitor.azure.com/;ApplicationId=9a96ee74-8a43-4542-ab31-96ab814559c9"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"