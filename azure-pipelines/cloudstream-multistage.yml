trigger:
  branches:
    include:
      - main

variables:
  acrName: cloudstreamacrshivani001
  imageTag: $(Build.BuildId)

stages:

# ==========================================
# BUILD
# ==========================================
- stage: Build
  jobs:

  - job: Build_API
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: Docker@2
      displayName: Build API Image
      inputs:
        command: buildAndPush
        repository: api-service
        dockerfile: src/api-service/Dockerfile
        containerRegistry: acr-service-connection
        tags: |
          $(imageTag)

  - job: Build_Worker
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: Docker@2
      displayName: Build Worker Image
      inputs:
        command: buildAndPush
        repository: worker-service
        dockerfile: src/worker-service/Dockerfile
        containerRegistry: acr-service-connection
        tags: |
          $(imageTag)

# ==========================================
# UAT
# ==========================================
- stage: UAT
  dependsOn: Build

  jobs:

  - deployment: Deploy_UAT
    environment: cloudstream-uat

    strategy:
      runOnce:
        deploy:

          steps:

          - task: KubernetesManifest@1
            inputs:
              action: deploy
              kubernetesServiceConnection: aks-service-connection
              namespace: cloudstream-uat
              manifests: |
                manifests/uat/*.yaml

# ==========================================
# PROD
# ==========================================
- stage: PROD
  dependsOn: UAT

  jobs:

  - deployment: Deploy_PROD
    environment: cloudstream-prod

    strategy:
      runOnce:
        deploy:

          steps:

          - task: KubernetesManifest@1
            inputs:
              action: deploy
              kubernetesServiceConnection: aks-service-connection
              namespace: cloudstream-prod
              manifests: |
                manifests/prod/*.yaml