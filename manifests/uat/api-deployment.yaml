apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-service
  namespace: cloudstream-uat

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-service

  template:
    metadata:
      labels:
        app: api-service
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: api-sa

      containers:
      - name: api-service
        image: cloudstreamacrshivani001.azurecr.io/api-service:v10
        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        env:
        - name: PORT
          value: "3000"

        - name: FUNCTION_URL
          value: "https://cloudstream-order-function.azurewebsites.net/api/orderNotification"

        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: cloudstream-secrets
              key: APPLICATIONINSIGHTS_CONNECTION_STRING

        envFrom:
        - configMapRef:
            name: api-config

        - secretRef:
            name: api-secret

        volumeMounts:
        - name: secrets-store-inline
          mountPath: /mnt/secrets-store
          readOnly: true

      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: azure-kv-secrets